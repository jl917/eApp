name: BETA Build Only App
on:
  workflow_dispatch:

jobs:
  ## semantic-release
  semantic-release:
    name: Semantic Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        uses: actions/cache@v3
        id: npm-cache
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
      - if: steps.npm-cache.outputs.cache-hit == 'true'
        run: echo 'npm cache hit!'
      - if: steps.npm-cache.outputs.cache-hit != 'true'
        run: echo 'npm cache missed!'
      - run: npm install

      # - name: Download artifacts
      #   uses: actions/download-artifact@v4
      #   with:
      #     pattern: electron-artifacts-*
      #     merge-multiple: true

      - name: Run Semantic Release
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: npx semantic-release

  ## app 빌드
  build-app:
    if: startsWith(github.ref, 'refs/heads/beta')
    name: Build and Upload Artifacts
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - platform: 'macos-latest'
            args: ''
          # - platform: 'ubuntu-latest'
          #   args: ''
          - platform: 'windows-latest'
            args: ''
    runs-on: ${{ matrix.platform }}
    needs: [semantic-release]
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
    outputs:
      success: ${{ job.status }} # 빌드 성공 여부를 output으로 저장
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull latest changes
        run: |
          git pull origin beta

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        uses: actions/cache@v3
        id: npm-cache
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
      - if: steps.npm-cache.outputs.cache-hit == 'true'
        run: echo 'npm cache hit!'
      - if: steps.npm-cache.outputs.cache-hit != 'true'
        run: echo 'npm cache missed!'
      - run: npm install

      # - name: Update version declarations
      #   env:
      #     GH_TOKEN: ${{ secrets.GH_TOKEN }}
      #   run: |
      #     npx semantic-release --dry-run
      - name: Build App
        run: npm run build:beta

      # - name: Move artifacts to outputs
      #   run: |
      #     mkdir outputs
      # - name: Move macOS artifacts to outputs
      #   if: matrix.platform == 'macos-latest'
      #   run: |
      #     cp -r out/beta/make/* outputs/
      # - name: Move Ubuntu artifacts to outputs
      #   if: matrix.platform == 'ubuntu-latest'
      #   run: |
      #     cp -r out/beta/make/* outputs/
      # - name: Move Windows artifacts to outputs
      #   if: matrix.platform == 'windows-latest'
      #   run: |
      #     cp -r out/beta/make/* outputs/
